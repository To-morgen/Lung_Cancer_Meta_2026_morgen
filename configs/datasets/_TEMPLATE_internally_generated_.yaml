# ============================================================================
# Public template — internally generated lung scRNA dataset
# Copy to configs_private/datasets/<dataset_id>.yaml and fill real local paths.
# Do not commit filled private configs.
# ============================================================================

dataset_id: "EXAMPLE_Lung_scRNA_2grp_v1"
dataset_class: "internally_generated"
owner: "example_user"
species: "mouse"
strain: "C57BL/6"
disease_model: "lung_cancer_model"
modality: "scrna"
platform: "10x_chromium"
vendor: "sequencing_provider"
n_samples: 4

groups:
  control:
    description: "control group"
    samples: ["control_1", "control_2"]
  treatment:
    description: "treatment group"
    samples: ["treatment_1", "treatment_2"]

comparisons:
  - name: "treatment_vs_control"
    numerator: "treatment"
    denominator: "control"
    purpose: "example two-group comparison"

fastq_source: "data/raw/internally_generated/EXAMPLE_Lung_scRNA_2grp_v1/fastq"
project_data_root: "data/raw/internally_generated/EXAMPLE_Lung_scRNA_2grp_v1"
cellranger_out: "data/raw/internally_generated/EXAMPLE_Lung_scRNA_2grp_v1/cellranger_out"
curated_out: "data/processed/curated/scrna/EXAMPLE_Lung_scRNA_2grp_v1"

alignment:
  tool: "cellranger"
  version: "<version>"
  reference: "<refdata path>"
  chemistry: "auto"
  localcores: 16
  localmem: 64

qc:
  min_nFeature: 200
  max_nFeature: 6000
  max_mito_pct: 15
  min_nCount: 500
  ambient_method: "SoupX"
  doublet_method: "scDblFinder"

normalization:
  method: "SCTransform"
  n_variable_features: 3000
