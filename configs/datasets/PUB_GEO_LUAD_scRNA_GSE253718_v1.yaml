# ============================================================================
# Public dataset config example — human LUAD scRNA, GSE253718
# Source: https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE253718
# Paths are relative placeholders; edit them for your local data layout.
# ============================================================================

dataset_id: "PUB_GEO_LUAD_scRNA_GSE253718_v1"
dataset_class: "public_original"
owner: "example_user"
species: "human"
disease: "EGFR-mutant LUAD"
modality: "scrna"
platform: "10x_chromium"
source: "GEO"
geo_accession: "GSE253718"
n_samples: 6

groups:
  naive:
    description: "treatment-naive"
    samples: ["naive_1", "naive_2", "naive_3"]
  resistant:
    description: "EGFR-TKI acquired resistance"
    samples: ["resistant_1", "resistant_2", "resistant_3"]

comparisons:
  - name: "resistant_vs_naive"
    numerator: "resistant"
    denominator: "naive"
    purpose: "Compare resistant and treatment-naive tumors"

project_data_root: "data/raw/public_original/PUB_GEO_LUAD_scRNA_GSE253718_v1"
mtx_dir: "data/raw/public_original/PUB_GEO_LUAD_scRNA_GSE253718_v1/mtx_per_sample"
manifest_path: "data/raw/public_original/PUB_GEO_LUAD_scRNA_GSE253718_v1/sample_manifest.csv"

samples:
  resistant_1: { group: "resistant", replicate: 1, accession: "GSM8026954" }
  resistant_2: { group: "resistant", replicate: 2, accession: "GSM8026955" }
  resistant_3: { group: "resistant", replicate: 3, accession: "GSM8026956" }
  naive_1:     { group: "naive",     replicate: 1, accession: "GSM8026957" }
  naive_2:     { group: "naive",     replicate: 2, accession: "GSM8026958" }
  naive_3:     { group: "naive",     replicate: 3, accession: "GSM8026959" }

qc_overrides:
  species: "human"
  mito_pattern: "^MT-"
  ribo_pattern: "^RP[SL]"
  skip_soupx: true

normalization:
  method: "SCTransform"
  n_variable_features: 3000
