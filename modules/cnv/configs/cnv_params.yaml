# ============================================================================
# cnv_params.yaml — CNV inference parameters
# ============================================================================

species: "mouse"

# ── Input ──
input:
  seurat_object: "results/scrna/06_annotate/objects/seurat_annotated.rds"
  cluster_column: "seurat_clusters"

# ── SCEVAN ──
scevan:
  organism: "mouse"
  par_cores: 8
  subclones: true
  downsample: null

  # Reference (normal) clusters for CNV baseline
  # From Phase 6 annotation:
  #   3=Neutrophil, 4=T cell, 5=Macrophage, 6=B cell,
  #   11=Endothelial, 14=Fibroblast, 15=NK
  # Set to "auto" to let SCEVAN auto-detect
  reference_clusters: [3, 4, 5, 6, 11, 14, 15]

# ── Validation ──
validation:
  # Clusters with tumor fraction below this are treated as reference
  ref_max_tumor_pct: 5
  # Clusters above this are candidate tumor clusters
  tumor_min_pct: 50

# ── inferCNV ──
infercnv:
  gene_order_file: "configs/mouse_gene_order_mm10.tsv"
  ref_group_names: ["Neutrophil", "T_cell", "Macrophage", "B_cell", "Endothelial", "Fibroblast", "NK"]
  ref_clusters: [3, 4, 5, 6, 11, 14, 15]
  cutoff: 0.1
  analysis_mode: "subclusters"
  HMM_type: "i6"
  denoise: true
  noise_filter: 0.1
  num_threads: 8
  cluster_by_groups: true

# ── Output ──
output:
  module_results: "results"
  main_results: "results/scrna/10_cnv"

# ── Output metadata column contract ──
# All downstream scripts use ONLY these column names.
metadata_columns:
  label: "scevan_label"
  source: "scevan_source"
  subclone: "scevan_subclone"
