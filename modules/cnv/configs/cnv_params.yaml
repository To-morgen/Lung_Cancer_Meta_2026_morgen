# ============================================================================
# cnv_params.yaml — CNV inference parameters
# ============================================================================

species: "mouse"

# ── Input ──
input:
  # seurat_object: "results/scrna/06_annotate/objects/seurat_singler_annotated.rds"
  seurat_object: "results/scrna/06_annotate/objects/seurat_annotated.rds"


# ── SCEVAN ──
scevan:
  organism: "mouse"
  par_cores: 8
  subclones: true           # detect subclones within tumor
  downsample: null          # null = full; integer = subsample cell count

  # Reference (normal) clusters for CNV baseline
  # From Phase 6 marker analysis:
  #   3=Neutrophil, 4=T cell, 5=Macrophage, 6=B cell,
  #   11=Endothelial, 14=Fibroblast, 15=NK
  # Set to "auto" to let SCEVAN auto-detect
  reference_clusters: [3, 4, 5, 6, 11, 14, 15]

# ── Output ──
output:
  module_results: "results"
  main_results: "results/scrna/10_cnv"

# ── inferCNV ──
infercnv:
  gene_order_file: "configs/mouse_gene_order_mm10.tsv"
  ref_group_names: ["Neutrophil", "T_cell", "Macrophage", "B_cell", "Endothelial", "Fibroblast", "NK"]
  # 上面用的是 cell type label（不是 cluster 编号）
  # 需要 Seurat metadata 里有 celltype 列——用 SingleR 或手动注释的结果
  # 如果还没有 celltype 列，可以用 cluster 编号：
  ref_clusters: [3, 4, 5, 6, 11, 14, 15]
  cutoff: 0.1              # 基因表达下限（log2 space）
  analysis_mode: "subclusters"   # "samples" | "subclusters"
  HMM_type: "i6"           # i3 or i6 (i6 = 6-state, higher resolution)
  denoise: true
  noise_filter: 0.1
  num_threads: 8
  cluster_by_groups: true   # 按 group (FL/A1/mc) 聚类展示
